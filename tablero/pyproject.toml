[project]
name = "tablero"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
authors = [
    { name = "Tino", email = "santinogianninoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "python-chess>=1.999",
    "rpi-lgpio>=0.6; sys_platform == 'linux' and platform_machine in 'aarch64 armv7l armv6l'",
    "rpi-ws281x>=5.0.0; sys_platform == 'linux' and platform_machine in 'aarch64 armv7l armv6l'",
]

[project.scripts]
tablero = "tablero:main"
simulacion = "tablero.simulacion:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# El wheel binario de pygame trae su propio SDL2 compilado sin soporte KMSDRM
# (falla con "pygame.error: kmsdrm not available" en io/pantalla.py), pero eso
# solo importa en la Raspberry. Forzarlo acá como config global rompía "uv sync"
# en cualquier otra máquina (compila pygame desde fuente ahí también, y sin el
# toolchain de esa plataforma falla). En la Pi, forzar el build desde fuente con
# `uv sync --no-binary-package pygame` (ver software-docs/pantalla.md).
