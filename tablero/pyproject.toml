[project]
name = "tablero"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
authors = [
    { name = "Tino", email = "santinogianninoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
    "rpi-lgpio>=0.6",
    "rpi-ws281x>=5.0.0",
]

[project.scripts]
tablero = "tablero:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
