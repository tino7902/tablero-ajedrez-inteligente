[project]
name = "tablero"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
authors = [
    { name = "Tino", email = "santinogianninoto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "python-chess>=1.999",
    "rpi-lgpio>=0.6",
    "rpi-ws281x>=5.0.0",
]

[project.scripts]
tablero = "tablero:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# El wheel binario de pygame trae su propio SDL2 compilado sin soporte KMSDRM
# (falla con "pygame.error: kmsdrm not available" en io/pantalla.py). Forzar
# build desde fuente lo enlaza contra el SDL2 del sistema, que sí lo tiene
# (ver docs/pantalla.md).
no-binary-package = ["pygame"]
